spring.application.name=rememory

# PostgreSQL 연결 설정
spring.datasource.url=jdbc:postgresql://localhost:5432/rememory
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

cookie.secure=${COOKIE_SECURE}
upload.dir=${UPLOAD_DIR}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# JWT 설정
jwt.secret=${JWT_SECRET}
# JWT 설정 30분 (Access Token)
jwt.expiration-ms= 1800000
# JWT 설정 7일 (Refresh Token)
jwt.refresh-expiration-ms= 604800000

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Batch Insert 설정
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true