spring.application.name=rememory

# PostgreSQL 연결 설정
spring.datasource.url=jdbc:postgresql://localhost:5432/rememory
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

cookie.secure=${COOKIE_SECURE}
upload.dir=${UPLOAD_DIR}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# JWT 설정
jwt.secret=${JWT_SECRET}
# JWT 설정 30분 (Access Token)
jwt.expiration-ms= 1800000
# JWT 설정 7일 (Refresh Token)
jwt.refresh-expiration-ms= 604800000

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Batch Insert 설정
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 카카오
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 구글
spring.security.oauth2.client.registration.google.client-id=구글앱키
spring.security.oauth2.client.registration.google.client-secret=구글시크릿
spring.security.oauth2.client.registration.google.scope=profile,email