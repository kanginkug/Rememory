name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production   # 배포 전 승인 단계 (Required reviewers)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            inkug/rememory-app:latest
            inkug/rememory-app:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub에 :latest 이미지가 push되면
      # EC2에서 실행 중인 Watchtower가 자동으로 감지하여 pull + 재시작합니다.
      # (SSH 접속 없이 배포되므로 22번 포트를 외부에 열 필요가 없습니다)
      #
      # 문제가 생겼을 때는 EC2에서 아래 명령으로 이전 커밋 SHA 이미지로 롤백할 수 있습니다.
      #   docker pull inkug/rememory-app:<이전 sha_short>
      #   docker tag inkug/rememory-app:<이전 sha_short> inkug/rememory-app:latest
      #   docker restart rememory-app
